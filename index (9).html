<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5C1B35">
<title>Village · Conferma presenza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
  /* ---------------------------------------------------------------
     UNICA COSA DA CAMBIARE: l'indirizzo dell'app web di Apps Script.
     Lo trovi in Distribuisci > Gestisci distribuzioni, finisce con /exec
     --------------------------------------------------------------- */
  :root {
    --api: '';
    --vinaccia: #5C1B35;
    --vinaccia-scuro: #4A1129;
    --panna: #FBF3EE;
    --salmone: #F2A79F;
    --salvia: #A9C9A6;
    --legno: #A3754A;
    --legno-chiaro: #E3B88A;
    --rosa-tenue: #E0B2BC;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--vinaccia);
    color: var(--panna);
    font-family: Archivo, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .schermo {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 28px 22px calc(22px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: relative;
    overflow: hidden;
  }

  .gatto {
    position: absolute;
    right: -30px;
    bottom: 90px;
    opacity: .14;
    pointer-events: none;
  }

  .testata {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .marchio { font-family: Fraunces, serif; font-size: 23px; font-weight: 800; letter-spacing: .04em; }
  .etichetta { font-size: 11px; font-weight: 600; letter-spacing: .16em; color: var(--rosa-tenue); text-transform: uppercase; }

  .filo { position: relative; width: 56px; height: 3px; background: var(--salvia); border-radius: 2px; }

  h1 { margin: 0; font-family: Fraunces, serif; font-size: 34px; line-height: 1.05; font-weight: 800; position: relative; }
  .occhiello { font-size: 13px; color: var(--rosa-tenue); margin-bottom: 8px; position: relative; }
  p { margin: 0; line-height: 1.5; position: relative; }

  .riquadro {
    position: relative;
    background: rgba(251,243,238,.07);
    border: 1px solid rgba(242,167,159,.4);
    border-radius: 18px;
    padding: 20px;
  }

  label { display: block; font-size: 13px; color: #EFC9CE; margin-bottom: 10px; }

  input[type=email], input[type=text] {
    width: 100%;
    min-height: 54px;
    padding: 14px 16px;
    border: 1px solid rgba(251,243,238,.3);
    border-radius: 14px;
    background: rgba(251,243,238,.06);
    color: var(--panna);
    font-family: Archivo, sans-serif;
    font-size: 17px;
  }
  input::placeholder { color: rgba(251,243,238,.45); }
  input:focus-visible, button:focus-visible, a:focus-visible {
    outline: 3px solid var(--legno-chiaro);
    outline-offset: 2px;
  }

  .contatore { display: flex; align-items: center; justify-content: space-between; }
  .tondo {
    width: 56px; height: 56px; border-radius: 50%;
    border: 1px solid rgba(251,243,238,.4);
    background: transparent; color: var(--panna);
    font-size: 28px; font-family: Archivo, sans-serif; cursor: pointer;
  }
  .tondo:disabled { opacity: .35; cursor: default; }
  .numerone { font-family: Fraunces, serif; font-size: 56px; font-weight: 800; line-height: 1; color: var(--salmone); }
  .sotto { font-size: 12px; color: #EFC9CE; margin-top: 4px; text-align: center; }

  .principale {
    position: relative;
    width: 100%;
    min-height: 60px;
    border: none;
    border-radius: 16px;
    background: var(--salmone);
    color: var(--vinaccia-scuro);
    font-family: Archivo, sans-serif;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
  }
  .principale:disabled { opacity: .5; cursor: default; }

  .secondario {
    position: relative;
    width: 100%;
    min-height: 52px;
    border: 1px solid rgba(251,243,238,.35);
    border-radius: 14px;
    background: transparent;
    color: var(--panna);
    font-family: Archivo, sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  .consenso {
    position: relative;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    background: rgba(169,201,166,.16);
    border: 1px solid rgba(169,201,166,.55);
    border-radius: 16px;
    padding: 16px;
  }
  .consenso input { width: 24px; height: 24px; margin: 1px 0 0; accent-color: var(--salvia); flex: none; }
  .consenso label { margin: 0; font-size: 14px; line-height: 1.45; color: #F3E5E2; }

  .nota { font-size: 11px; line-height: 1.5; color: #D29FAD; text-align: center; position: relative; }
  .nota a { color: var(--salmone); }

  .avviso {
    position: relative;
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.45;
    background: rgba(227,184,138,.2);
    border: 1px solid rgba(227,184,138,.5);
  }
  .avviso.male { background: rgba(242,167,159,.18); border-color: rgba(242,167,159,.6); }

  .spinta { margin-top: auto; }
  .nascosto { display: none !important; }

  .fatto { text-align: center; padding: 40px 0 10px; position: relative; }
  .fatto .segno {
    width: 96px; height: 96px; margin: 0 auto 22px;
    border-radius: 50%; background: var(--salvia);
    display: flex; align-items: center; justify-content: center;
  }
  .fatto h1 { margin-bottom: 10px; }

  @media (prefers-reduced-motion: no-preference) {
    .riquadro, .fatto { animation: entra .25s ease-out; }
    @keyframes entra { from { opacity: 0; transform: translateY(6px); } }
  }
</style>
</head>
<body>

<div class="schermo">

  <svg class="gatto" viewBox="0 0 120 140" width="210" height="245" aria-hidden="true" focusable="false">
    <path fill="#E3B88A" d="M44 30 L36 6 L58 22 C62 21 66 21 70 22 L92 6 L84 30 C94 40 98 54 98 66 C98 80 92 92 92 104 C92 120 100 126 104 132 L28 132 C20 132 16 126 16 118 C16 100 30 92 30 76 C30 60 34 42 44 30 Z"/>
    <path d="M104 132 C120 127 124 110 113 102" fill="none" stroke="#E3B88A" stroke-width="9" stroke-linecap="round"/>
  </svg>

  <header class="testata">
    <span class="marchio">Village</span>
    <span class="etichetta" id="etichettaEvento">Ceramica</span>
  </header>
  <div class="filo"></div>

  <!-- 1. ricerca ------------------------------------------------------- -->
  <section id="passoRicerca">
    <div class="occhiello" id="dataOggi">&nbsp;</div>
    <h1>Com'è andata?</h1>
    <p style="color:#EFC9CE; margin-top:10px">Confermaci chi c'era. Ci metti dieci secondi.</p>

    <form class="riquadro" id="formRicerca" style="margin-top:20px" novalidate>
      <label for="email">La mail che hai usato per prenotare</label>
      <input type="email" id="email" name="email" inputmode="email" autocomplete="email"
             placeholder="nome@esempio.it" required>
      <button type="submit" class="principale" style="margin-top:16px" id="btnCerca">Continua</button>
    </form>

    <div id="avvisoRicerca" class="avviso nascosto" style="margin-top:16px"></div>

    <button type="button" class="secondario nascosto" id="btnNonTrovato" style="margin-top:12px">
      Non trovo la mia prenotazione
    </button>
  </section>

  <!-- 2. conferma ------------------------------------------------------ -->
  <section id="passoConferma" class="nascosto">
    <div class="occhiello" id="dettaglioTurno">&nbsp;</div>
    <h1 id="saluto">Ciao</h1>

    <div class="riquadro" style="margin-top:20px">
      <label id="etichettaPosti">La tua prenotazione era per</label>
      <div class="contatore">
        <button type="button" class="tondo" id="meno" aria-label="Togli una persona">−</button>
        <div>
          <div class="numerone" id="quanti">1</div>
          <div class="sotto" id="paroleQuanti">persona</div>
        </div>
        <button type="button" class="tondo" id="piu" aria-label="Aggiungi una persona">+</button>
      </div>
    </div>

    <div class="consenso" style="margin-top:16px">
      <input type="checkbox" id="newsletter">
      <label for="newsletter">Voglio ricevere via email i prossimi workshop e le serate del Village</label>
    </div>

    <button type="button" class="principale" id="btnConferma" style="margin-top:16px">Confermo la presenza</button>
    <div id="avvisoConferma" class="avviso male nascosto" style="margin-top:14px"></div>
  </section>

  <!-- 3. non in lista -------------------------------------------------- -->
  <section id="passoNuovo" class="nascosto">
    <div class="occhiello">Nessun problema</div>
    <h1>Dicci chi sei</h1>
    <p style="color:#EFC9CE; margin-top:10px">Controlliamo noi e sistemiamo.</p>

    <form class="riquadro" id="formNuovo" style="margin-top:20px" novalidate>
      <label for="nuovoNome">Nome e cognome</label>
      <input type="text" id="nuovoNome" autocomplete="name" required>

      <label for="nuovaEmail" style="margin-top:16px">Email</label>
      <input type="email" id="nuovaEmail" inputmode="email" autocomplete="email">

      <label for="nuoviPosti" style="margin-top:16px">Quante persone siete</label>
      <input type="text" id="nuoviPosti" inputmode="numeric" value="1">

      <div class="consenso" style="margin-top:18px">
        <input type="checkbox" id="nuovaNewsletter">
        <label for="nuovaNewsletter">Tenetemi aggiornato sui prossimi workshop</label>
      </div>

      <button type="submit" class="principale" style="margin-top:16px">Invia</button>
    </form>

    <button type="button" class="secondario" id="btnIndietro" style="margin-top:12px">Torna indietro</button>
    <div id="avvisoNuovo" class="avviso male nascosto" style="margin-top:14px"></div>
  </section>

  <!-- 4. fatto --------------------------------------------------------- -->
  <section id="passoFatto" class="nascosto">
    <div class="fatto">
      <div class="segno">
        <svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true" focusable="false">
          <path d="M4 12.5 L9.5 18 L20 6" fill="none" stroke="#203A1F" stroke-width="2.6"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Grazie!</h1>
      <p style="color:#EFC9CE; margin-top:10px" id="testoFatto">È tutto a posto.</p>
    </div>
  </section>

  <p class="nota spinta">
    Trattiamo i tuoi dati come spiegato nella
    <a href="https://crazycatcafe.it/privacy-policy" target="_blank" rel="noopener">privacy policy</a>.
  </p>

</div>

<script>
(function () {
  'use strict';

  // ===================================================================
  // INCOLLA QUI l'indirizzo dell'app web di Apps Script (finisce con /exec)
  const API = 'INCOLLA_QUI_URL_APPS_SCRIPT';
  // ===================================================================

  var stato = { id: null, posti: 1, prenotati: 1 };

  var el = function (id) { return document.getElementById(id); };
  var mostra = function (id) {
    ['passoRicerca', 'passoConferma', 'passoNuovo', 'passoFatto'].forEach(function (p) {
      el(p).classList.toggle('nascosto', p !== id);
    });
  };
  var avviso = function (id, testo, male) {
    var n = el(id);
    n.textContent = testo;
    n.classList.toggle('male', !!male);
    n.classList.toggle('nascosto', !testo);
  };

  function chiama(dati) {
    var corpo = new URLSearchParams();
    Object.keys(dati).forEach(function (k) { corpo.append(k, dati[k]); });
    return fetch(API, { method: 'POST', body: corpo })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        if (!r.ok) throw new Error(r.errore || 'Errore');
        return r;
      });
  }

  // data di oggi, scritta per esteso
  try {
    var oggi = new Date();
    var testo = oggi.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
    el('dataOggi').textContent = testo.charAt(0).toUpperCase() + testo.slice(1);
  } catch (e) { /* niente di grave */ }

  function aggiornaContatore() {
    el('quanti').textContent = stato.posti;
    el('paroleQuanti').textContent = stato.posti === 1 ? 'persona' : 'persone';
    el('meno').disabled = stato.posti <= 0;
  }

  el('meno').addEventListener('click', function () {
    if (stato.posti > 0) { stato.posti--; aggiornaContatore(); }
  });
  el('piu').addEventListener('click', function () {
    stato.posti++; aggiornaContatore();
  });

  el('formRicerca').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var email = el('email').value.trim();
    if (!email) return;
    var btn = el('btnCerca');
    btn.disabled = true; btn.textContent = 'Un attimo…';
    avviso('avvisoRicerca', '');

    chiama({ azione: 'cerca', email: email })
      .then(function (r) {
        if (!r.trovata) {
          avviso('avvisoRicerca',
            'Non troviamo una prenotazione con questa mail per oggi. Forse ne hai usata un’altra.');
          el('btnNonTrovato').classList.remove('nascosto');
          return;
        }
        stato.id = r.id;
        stato.prenotati = r.posti;
        stato.posti = r.giaConfermata ? r.presenti : r.posti;
        el('saluto').textContent = 'Ciao ' + r.nome + ',';
        el('dettaglioTurno').textContent = r.evento + (r.turno ? ' · turno delle ' + r.turno : '');
        el('etichettaPosti').textContent = r.giaConfermata
          ? 'Avevi già confermato per'
          : 'La tua prenotazione era per ' + r.posti + (r.posti === 1 ? ' persona' : ' persone');
        el('newsletter').checked = !!r.newsletter;
        aggiornaContatore();
        mostra('passoConferma');
      })
      .catch(function (err) {
        avviso('avvisoRicerca', 'Qualcosa non ha funzionato: ' + err.message, true);
        el('btnNonTrovato').classList.remove('nascosto');
      })
      .finally(function () {
        btn.disabled = false; btn.textContent = 'Continua';
      });
  });

  el('btnConferma').addEventListener('click', function () {
    var btn = el('btnConferma');
    btn.disabled = true; btn.textContent = 'Salvo…';
    avviso('avvisoConferma', '');

    chiama({
      azione: 'conferma',
      id: stato.id,
      presenti: stato.posti,
      newsletter: el('newsletter').checked ? 'true' : 'false'
    })
      .then(function () {
        el('testoFatto').textContent = stato.posti > 0
          ? 'Presenza registrata. Buona ceramica!'
          : 'Abbiamo segnato che non siete venuti. Alla prossima!';
        mostra('passoFatto');
      })
      .catch(function (err) {
        avviso('avvisoConferma', 'Non è stato salvato: ' + err.message, true);
      })
      .finally(function () {
        btn.disabled = false; btn.textContent = 'Confermo la presenza';
      });
  });

  el('btnNonTrovato').addEventListener('click', function () {
    el('nuovaEmail').value = el('email').value.trim();
    mostra('passoNuovo');
  });
  el('btnIndietro').addEventListener('click', function () { mostra('passoRicerca'); });

  el('formNuovo').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var nome = el('nuovoNome').value.trim();
    if (!nome) { avviso('avvisoNuovo', 'Serve almeno il nome.', true); return; }
    avviso('avvisoNuovo', '');

    chiama({
      azione: 'nuovo',
      nome: nome,
      email: el('nuovaEmail').value.trim(),
      posti: el('nuoviPosti').value.trim() || '1',
      newsletter: el('nuovaNewsletter').checked ? 'true' : 'false'
    })
      .then(function () {
        el('testoFatto').textContent = 'Ti abbiamo segnato. Controlliamo noi e sistemiamo, grazie!';
        mostra('passoFatto');
      })
      .catch(function (err) {
        avviso('avvisoNuovo', 'Non è stato inviato: ' + err.message, true);
      });
  });
})();
</script>
</body>
</html>
